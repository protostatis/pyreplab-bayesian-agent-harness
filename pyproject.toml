[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreplab-bayesian-agent-harness"
version = "0.1.0"
description = "A verifiable task gym and policy allocator experiment for agent harnesses"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/protostatis/pyreplab-bayesian-agent-harness"
Issues = "https://github.com/protostatis/pyreplab-bayesian-agent-harness/issues"

[project.scripts]
pyreplab-harness = "pyreplab_harness.cli:main"
pyreplab-harness-smoke = "pyreplab_harness.orchestrator:main"
pyreplab-unbrowser-smoke = "pyreplab_harness.unbrowser_smoke:main"
pyreplab-unbrowser-interactive-smoke = "pyreplab_harness.unbrowser_interactive_smoke:main"
pyreplab-outcome-model-smoke = "pyreplab_harness.outcome_model_smoke:main"
pyreplab-outcome-model-learn-smoke = "pyreplab_harness.outcome_model_learn_smoke:main"
pyreplab-m3-exploratory-screen = "pyreplab_harness.m3_exploratory_screen:main"
pyreplab-m3-observation-canary-gate = "pyreplab_harness.m3_observation_canary_gate:main"
pyreplab-m3-semantic-capability-gate = "pyreplab_harness.m3_semantic_capability_gate:main"
pyreplab-m3-semantic-diagnostic = "pyreplab_harness.m3_semantic_diagnostic:main"
pyreplab-m3-utility-routing-smoke = "pyreplab_harness.m3_utility_routing_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
